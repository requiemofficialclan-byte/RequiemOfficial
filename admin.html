<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Requiem</title>
<link rel="stylesheet" href="style.css">
<style>
.login-wrap { max-width:380px; margin:100px auto 0; }
.a-input { width:100%; background:rgba(5,0,10,0.6); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:0.72rem 1rem; font-size:0.92rem; font-family:inherit; outline:none; transition:border-color 0.18s; margin-top:0.35rem; }
.a-input:focus { border-color:rgba(232,0,58,0.4); }

.tc { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:1.2rem 1.4rem; margin-bottom:0.9rem; transition:border-color 0.18s; }
.tc:hover { border-color:var(--border-hover); }
.tc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap; gap:0.4rem; }
.tc-id   { font-weight:800; font-size:1rem; color:var(--red-light); }
.tc-meta { font-size:0.8rem; color:var(--text-muted); margin-bottom:0.7rem; }

.status-pill { display:inline-flex; align-items:center; gap:0.3rem; padding:0.18rem 0.7rem; border-radius:999px; font-size:0.74rem; font-weight:700; }
.sp-pending  { background:rgba(255,179,71,0.1);  color:#ffb347; border:1px solid rgba(255,179,71,0.25); }
.sp-answered { background:rgba(0,212,170,0.1);   color:#00d4aa; border:1px solid rgba(0,212,170,0.25); }
.sp-closed   { background:rgba(255,255,255,0.05); color:var(--text-muted); border:1px solid rgba(255,255,255,0.1); }

/* Чат */
.chat-box {
  display:flex; flex-direction:column; gap:0.5rem;
  max-height:260px; overflow-y:auto;
  padding:0.6rem; margin:0.6rem 0;
  background:rgba(0,0,0,0.2); border-radius:10px;
  border:1px solid rgba(255,255,255,0.04);
}
.chat-bubble { max-width:88%; padding:0.55rem 0.8rem; border-radius:11px; font-size:0.87rem; line-height:1.5; word-break:break-word; }
.bubble-user  { align-self:flex-end; background:rgba(232,0,58,0.1); border:1px solid rgba(232,0,58,0.2); color:var(--text); }
.bubble-admin { align-self:flex-start; background:rgba(0,212,170,0.07); border:1px solid rgba(0,212,170,0.18); color:var(--text); }
.bubble-meta  { font-size:0.67rem; color:var(--text-muted); margin-bottom:0.2rem; font-weight:600; }

.reply-row { display:flex; gap:0.5rem; align-items:flex-end; margin-top:0.5rem; }
.reply-in {
  flex:1; background:rgba(5,0,10,0.6); color:var(--text);
  border:1px solid var(--border); border-radius:10px;
  padding:0.58rem 0.85rem; font-size:0.88rem; font-family:inherit;
  outline:none; resize:none; min-height:40px; transition:border-color 0.18s;
}
.reply-in:focus { border-color:rgba(232,0,58,0.4); }

.ftab { padding:0.33rem 0.85rem; border-radius:999px; font-size:0.82rem; font-weight:600; border:1px solid var(--border); background:var(--card-bg); color:var(--text-muted); cursor:pointer; font-family:inherit; transition:all 0.18s; }
.ftab:hover { color:var(--text); border-color:var(--border-hover); }
.ftab.active { background:var(--red-subtle); color:var(--red-light); border-color:rgba(232,0,58,0.3); }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>

<header>
  <div class="container">
    <div class="site-brand"><span class="brand-icon">⚔️</span><span class="brand-name">Requiem</span></div>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">← На сайт</a>
      <a href="admin.html" class="nav-link active">⚙️ Админка</a>
    </nav>
  </div>
</header>

<main>
  <div id="loginSection">
    <div class="login-wrap">
      <div class="card">
        <h2 class="card-title"><span class="icon">🔐</span>Вход</h2>
        <p style="font-size:0.87rem;color:var(--text-secondary);margin-bottom:1rem;">Только для администрации Requiem.</p>
        <div style="margin-bottom:0.8rem;">
          <label class="f-label" style="font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Email</label>
          <input type="email" id="adminEmail" class="a-input" placeholder="admin@requiem.gg">
        </div>
        <div style="margin-bottom:1rem;">
          <label class="f-label" style="font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Пароль</label>
          <input type="password" id="adminPass" class="a-input" placeholder="••••••••">
        </div>
        <div id="loginErr" style="color:var(--red-light);font-size:0.84rem;margin-bottom:0.7rem;display:none;"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Войти</button>
      </div>
    </div>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap;gap:0.8rem;">
        <div>
          <h1 style="font-size:1.5rem;font-weight:800;">Заявки поддержки</h1>
          <div id="adminUser" style="font-size:0.78rem;color:var(--text-muted);margin-top:0.15rem;"></div>
        </div>
        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
          <span id="statsEl" style="font-size:0.82rem;color:var(--text-muted);"></span>
          <button class="btn btn-ghost" onclick="loadTickets()" style="padding:0.38rem 0.85rem;font-size:0.82rem;">🔄</button>
          <button class="btn btn-ghost" onclick="doLogout()" style="padding:0.38rem 0.85rem;font-size:0.82rem;">Выйти</button>
        </div>
      </div>

      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.1rem;">
        <button class="ftab active" onclick="setFilter('all',this)">Все</button>
        <button class="ftab" onclick="setFilter('pending',this)">⏳ Ожидают</button>
        <button class="ftab" onclick="setFilter('answered',this)">✅ Отвечено</button>
        <button class="ftab" onclick="setFilter('closed',this)">🔒 Закрыто</button>
      </div>

      <div id="ticketsList"></div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, doc, updateDoc, arrayUnion, onSnapshot }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDA-Zg7z8_SH-1cvd7MMw75q5tkXzScmDI",
  authDomain: "supportrequiem-4481f.firebaseapp.com",
  projectId: "supportrequiem-4481f",
  storageBucket: "supportrequiem-4481f.firebasestorage.app",
  messagingSenderId: "554859594853",
  appId: "1:554859594853:web:908c519dbe00543ff2328c"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let allTickets = [];
let currentFilter = 'all';
let ticketsUnsub = null;

function isAdminMessage(m) {
  return m.author === 'admin' || m.from === 'admin';
}

function saveReplyDrafts() {
  const drafts = {};
  document.querySelectorAll('.reply-in').forEach(el => {
    const id = el.id.replace('ans-', '');
    if (el.value) drafts[id] = el.value;
  });
  return drafts;
}

function restoreReplyDrafts(drafts) {
  Object.entries(drafts).forEach(([id, val]) => {
    const el = document.getElementById('ans-' + id);
    if (el) el.value = val;
  });
}

function fmtTime(ts) {
  if (!ts) return '';
  return new Date(typeof ts === 'object' && ts.seconds ? ts.seconds*1000 : ts)
    .toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('adminUser').textContent = '👤 ' + user.email;
    subscribeTickets();
  } else {
    if (ticketsUnsub) {
      ticketsUnsub();
      ticketsUnsub = null;
    }
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
  }
});

window.doLogin = async function() {
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  const err   = document.getElementById('loginErr');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent='Заполни email и пароль'; err.style.display='block'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    const msgs = { 'auth/invalid-credential':'Неверный email или пароль', 'auth/too-many-requests':'Слишком много попыток. Подожди.' };
    err.textContent = msgs[e.code] || 'Ошибка: ' + e.message;
    err.style.display = 'block';
  }
};

window.doLogout = () => signOut(auth);
document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key==='Enter') window.doLogin(); });

function subscribeTickets() {
  const list = document.getElementById('ticketsList');
  list.innerHTML = '<p style="color:var(--text-muted);font-size:0.88rem;">Загрузка...</p>';

  if (ticketsUnsub) ticketsUnsub();

  ticketsUnsub = onSnapshot(
    query(collection(db, 'tickets'), orderBy('createdAt', 'desc')),
    snap => {
      const drafts = saveReplyDrafts();
      allTickets = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
      updateStats();
      renderTickets();
      restoreReplyDrafts(drafts);
    },
    err => {
      list.innerHTML = '<p style="color:var(--red-light);">Ошибка: ' + err.message + '</p>';
    }
  );
}

window.loadTickets = subscribeTickets;

function updateStats() {
  const p = allTickets.filter(t=>t.status==='pending').length;
  const a = allTickets.filter(t=>t.status==='answered').length;
  document.getElementById('statsEl').textContent = `Всего: ${allTickets.length} · Ожидают: ${p} · Отвечено: ${a}`;
}

window.setFilter = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTickets();
};

const statusMap = {
  pending:  { cls:'sp-pending',  label:'⏳ Ожидает' },
  answered: { cls:'sp-answered', label:'✅ Отвечено' },
  closed:   { cls:'sp-closed',   label:'🔒 Закрыто' },
};

function renderTickets() {
  const list     = document.getElementById('ticketsList');
  const filtered = currentFilter==='all' ? allTickets : allTickets.filter(t=>t.status===currentFilter);

  if (!filtered.length) { list.innerHTML='<p style="color:var(--text-muted);font-size:0.88rem;">Заявок нет.</p>'; return; }

  list.innerHTML = filtered.map(t => {
    const s    = statusMap[t.status] || statusMap.pending;
    const date = fmtTime(t.createdAt);
    const msgs = t.messages || [];

    const chatHtml = msgs.length
      ? msgs.map(m => `
          <div class="chat-bubble ${isAdminMessage(m) ? 'bubble-admin' : 'bubble-user'}">
            <div class="bubble-meta">${isAdminMessage(m) ? '⚜️ Администрация' : '👤 '+(m.nick||t.nick)} · ${fmtTime(m.time)}</div>
            ${m.text.replace(/\n/g,'<br>')}
          </div>`).join('')
      : '<p style="color:var(--text-muted);font-size:0.82rem;">Нет сообщений</p>';

    return `
    <div class="tc">
      <div class="tc-head">
        <span class="tc-id">${t.ticketId}</span>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <span class="status-pill ${s.cls}">${s.label}</span>
          <span style="font-size:0.75rem;color:var(--text-muted);">${date}</span>
        </div>
      </div>
      <div class="tc-meta">
        👤 <strong style="color:var(--text);">${t.nick}</strong>
        ${t.discordId ? `· 🆔 <code style="background:rgba(255,255,255,0.05);padding:0.08rem 0.4rem;border-radius:4px;font-size:0.78rem;">${t.discordId}</code>` : ''}
        · 📂 ${t.category}
      </div>
      <div class="chat-box" id="cb-${t._id}">${chatHtml}</div>
      <div class="reply-row">
        <textarea class="reply-in" id="ans-${t._id}" placeholder="Написать ответ..." rows="2"></textarea>
        <button class="btn btn-primary" style="padding:0.52rem 0.9rem;font-size:0.82rem;white-space:nowrap;" onclick="sendReply('${t._id}')">
          Ответить
        </button>
      </div>
      ${t.status!=='closed' ? `<button class="btn btn-ghost" style="margin-top:0.5rem;padding:0.35rem 0.85rem;font-size:0.8rem;" onclick="closeTicket('${t._id}')">🔒 Закрыть заявку</button>` : ''}
    </div>`;
  }).join('');

  // Скролл чатов вниз
  filtered.forEach(t => {
    const cb = document.getElementById('cb-' + t._id);
    if (cb) cb.scrollTop = cb.scrollHeight;
  });
}

window.sendReply = async function(docId) {
  const text = document.getElementById('ans-' + docId).value.trim();
  if (!text) return;
  try {
    await updateDoc(doc(db,'tickets',docId), {
      messages: arrayUnion({ author:'admin', nick:'Администрация', text, time: Date.now() }),
      status: 'answered'
    });
    const input = document.getElementById('ans-' + docId);
    if (input) input.value = '';
  } catch(e) { alert('Ошибка: ' + e.message); }
};

window.closeTicket = async function(docId) {
  try {
    await updateDoc(doc(db,'tickets',docId), { status:'closed' });
  } catch(e) { alert('Ошибка: ' + e.message); }
};
</script>
<script src="script.js"></script>
</body>
</html>
